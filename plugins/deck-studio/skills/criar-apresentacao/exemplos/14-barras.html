<!-- TIPO: gráfico de barras em escala, animado (componente BARRAS)
QUANDO USAR: comparar de 2 a 8 valores da mesma métrica (métodos, conjuntos, condições). É o gráfico padrão do deck:
use-o em vez do SVG estático do 07 sempre que a fonte dá os números. Os valores vêm do FACTS.md (o número exato, com
as casas da fonte), e a página vai nas notas.
REGRAS: "casas" igual à precisão da fonte; "unidade" curta (%, ms, cm/s); a cor de conceito só na barra do trabalho
(ou do conceito dela), as outras sem cor; uma barra por passo, na ordem da fala ("juntas": true quando a comparação
é uma só); o eixo começa no zero (o componente faz isso). O botão Tabela mostra os mesmos números. Validação e teste
nunca no mesmo gráfico. Os nomes e números abaixo são de mentira: troque todos. -->
