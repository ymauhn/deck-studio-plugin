<!-- TIPO: gráfico
QUANDO USAR: só quando o gráfico precisa ser estático (uma figura que o componente não faz). Para barras, use o 14
(BARRAS), animado; para etapas, o 15 (ESCADA); para antes e depois, o 16 (PONTOS). Se a fonte já tem a
figura do gráfico, use a figura (03 ou 04); faça este só quando a fonte dá a tabela e não o gráfico.
REGRAS: SVG estático escrito à mão (nenhum script roda num slide): um eixo, barras de até 24 px de espessura com 2 px
de folga, o valor escrito na ponta de cada barra (.val), o rótulo de cada barra em texto; cada barra tem um <title>
(a dica ao passar o mouse); a cor de conceito só na barra que é daquele conceito, o resto em var(--ink-2);
os mesmos números numa tabela dentro de <details><summary>Tabela</summary>, para quem quiser ler os valores; o
subtítulo diz de onde vêm os números. Validação e teste nunca no mesmo gráfico. -->
